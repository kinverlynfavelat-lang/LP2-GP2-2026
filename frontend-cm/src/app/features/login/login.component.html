<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card login-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="login-icon mx-auto mb-3">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h3 class="fw-bold mb-1">UPeU Salud</h3>
        <p class="text-muted small mb-0">
          Acceso para personal del Centro Médico Universitario
        </p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="usuario" class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-person"></i>
            </span>
            <input
              id="usuario"
              type="text"
              class="form-control"
              name="usuario"
              [(ngModel)]="credentials.usuario"
              placeholder="Ej. admin"
              autocomplete="username"
              required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input
              id="password"
              [type]="mostrarPassword ? 'text' : 'password'"
              class="form-control"
              name="password"
              [(ngModel)]="credentials.password"
              placeholder="••••••••"
              autocomplete="current-password"
              required>
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="mostrarPassword = !mostrarPassword"
              tabindex="-1">
              <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-semibold"
          [disabled]="cargando">
          @if (cargando) {
            <span class="spinner-border spinner-border-sm me-2"></span>
            Verificando...
          } @else {
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Iniciar sesión
          }
        </button>
      </form>

      <hr class="my-4">

      <div class="text-center">
        <p class="text-muted small mb-2">¿Eres estudiante o docente y deseas reservar una cita?</p>
        <a routerLink="/portal-paciente" class="btn btn-outline-primary btn-sm w-100">
          <i class="bi bi-calendar-check me-2"></i>
          Ir al Portal del Paciente (sin inicio de sesión)
        </a>
      </div>

    </div>
  </div>
</div>
